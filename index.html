<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>青柠私语</title>
<style>
:root{--bg:#101114;--panel:#1b1c21;--text:#f5f5f6;--muted:#92949d;--line:#303139;--mine:#b9e7a2;--mineText:#243321;--other:#282a30;--accent:#9bcf82;--field:#24252b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body[data-theme="day"]{--bg:#f3f4f6;--panel:#fff;--text:#22242a;--muted:#777b85;--line:#e2e4e8;--mine:#bce8a7;--mineText:#243321;--other:#fff;--accent:#68a94e;--field:#f6f7f8}
body[data-theme="cute"]{--bg:#fff2f7;--panel:#fffafd;--text:#593c50;--muted:#a17f96;--line:#f3d9e7;--mine:#ffcce1;--mineText:#713d59;--other:#fff;--accent:#e98bb7;--field:#fff3f8}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:600px;min-height:100dvh;margin:auto;background:var(--bg);display:flex;flex-direction:column;position:relative}
header{height:64px;display:flex;align-items:center;padding:0 15px;border-bottom:1px solid var(--line);gap:11px;background:var(--panel)}
.avatar{width:39px;height:39px;border-radius:50%;background:var(--field);display:grid;place-items:center;overflow:hidden;flex-shrink:0;font-size:23px}
.avatar img,.callAvatar img{width:100%;height:100%;object-fit:cover}
.headName{flex:1;min-width:0;font-weight:650}
.sub{font-size:11px;color:var(--muted);margin-top:3px;font-weight:400}
.iconBtn{border:0;background:transparent;color:var(--text);font-size:21px;padding:7px}
.chat{flex:1;padding:17px 13px 20px;overflow:auto;min-height:50vh}
.dayline{text-align:center;color:var(--muted);font-size:11px;margin:12px 0}
.msg{display:flex;gap:8px;margin:14px 0;align-items:flex-end}
.msg.me{flex-direction:row-reverse}
.msg .avatar{width:30px;height:30px;font-size:17px}
.bubble{max-width:76%;padding:11px 13px;border-radius:15px;background:var(--other);color:var(--text);overflow-wrap:anywhere;line-height:1.55;white-space:pre-wrap}
.me .bubble{background:var(--mine);color:var(--mineText);border-bottom-right-radius:5px}
.msg:not(.me) .bubble{border-bottom-left-radius:5px}
.time{font-size:10px;color:var(--muted);margin:4px 5px 0}
.me .time{text-align:right}
.bar{background:var(--panel);border-top:1px solid var(--line);padding:10px 11px max(12px,env(safe-area-inset-bottom))}
.tools{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px}
.tool{border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:10px;padding:7px 11px;white-space:nowrap;font-size:12px}
.sendrow{display:flex;gap:8px;align-items:flex-end}
#input{flex:1;min-width:0;resize:none;max-height:110px;border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:12px;padding:11px}
.send{border:0;background:var(--accent);color:#172017;border-radius:11px;padding:12px 16px;font-weight:650}
.panel{position:absolute;z-index:10;left:10px;right:10px;bottom:95px;max-height:75dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 45px #0004}
.hidden{display:none!important}
.panelHead{font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}
.close{border:0;background:transparent;color:var(--muted);font-size:25px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.menuBtn,.btn{border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:11px;padding:12px;text-align:left}
.btn{display:inline-block;text-align:center;margin-top:10px}
.primary{background:var(--accent);color:#182018;border:0}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 7px}
.field{width:100%;border:1px solid var(--line);background:var(--field);color:var(--text);padding:11px;border-radius:10px;outline:none}
textarea.field{resize:vertical;min-height:70px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0;flex:1}
.note{color:var(--muted);font-size:11px;line-height:1.6}
.cardItem{padding:11px;border:1px solid var(--line);border-radius:12px;margin-top:9px}
.cardTitle{font-weight:650}
.cardText{font-size:13px;color:var(--muted);margin:5px 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.cardBtns{display:flex;gap:7px}
.cardBtns button{flex:1;border:0;border-radius:8px;padding:8px;background:var(--field);color:var(--text);font-size:12px}
.transfer{width:min(275px,75vw);border-radius:15px;overflow:hidden;background:#f3aa4c;color:white;box-shadow:0 4px 15px #0002}
.transferTop{display:flex;gap:11px;align-items:center;padding:15px}
.transferIcon{width:42px;height:42px;border-radius:12px;background:#ffffff30;display:grid;place-items:center;font-size:25px}
.transferTitle{font-size:12px;opacity:.9}
.money{font-size:27px;font-weight:700;margin-top:4px}
.transferNote{padding:0 16px 14px;font-size:12px}
.transferBottom{background:#fff2df;color:#95662c;padding:11px 14px;font-size:12px}
.callMini{position:fixed;z-index:20;top:75px;left:50%;transform:translateX(-50%);width:min(350px,calc(100vw - 28px));background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 8px 35px #0005}
.callMiniTop{display:flex;align-items:center;gap:10px}
.callAvatar{width:43px;height:43px;border-radius:50%;background:var(--field);display:grid;place-items:center;overflow:hidden;font-size:22px}
.callDetails{flex:1}
.callState{font-size:12px;color:var(--muted);margin-top:4px}
.callActions{display:flex;gap:8px;margin-top:12px}
.callActions button{flex:1;border:0;border-radius:10px;padding:10px;background:var(--accent);color:#172017}
.callActions .red{background:#e75d67;color:white}
.callActions .dark{background:var(--field);color:var(--text)}
</style>
</head>
<body data-theme="dark">
<div class="app">
<header>
  <div class="avatar" id="headAvatar">🐺</div>
  <div class="headName"><div id="headName">小猪</div><div class="sub">青柠私语 · 私人聊天空间</div></div>
  <button class="iconBtn" id="openMenu">☰</button>
</header>

<main class="chat" id="chat"></main>

<footer class="bar">
  <div class="tools">
    <button class="tool" id="openCards">▤ 字卡</button>
    <button class="tool" id="openEmoji">☺ 表情</button>
    <button class="tool" id="openLetter">✉ 写信</button>
    <button class="tool" id="callMe">☎ 电话</button>
  </div>
  <div class="sendrow">
    <textarea id="input" rows="1" placeholder="发送消息……"></textarea>
    <button class="send" id="send">发送</button>
  </div>
</footer>

<section class="panel hidden" id="menuPanel">
  <div class="panelHead">功能菜单 <button class="close" data-close>×</button></div>
  <div class="grid">
    <button class="menuBtn" data-open="settingsPanel">⚙️ 设置与主题</button>
    <button class="menuBtn" data-open="profilePanel">🖼️ 头像与名称</button>
    <button class="menuBtn" data-open="cardsPanel">▤ 字卡库管理</button>
    <button class="menuBtn" data-open="transferPanel">￥ 给对方转账</button>
    <button class="menuBtn" data-open="letterPanel">✉ 写信</button>
    <button class="menuBtn" data-open="emojiPanel">☺ 表情管理</button>
  </div>
</section>

<section class="panel hidden" id="settingsPanel">
  <div class="panelHead">设置与主题 <button class="close" data-close>×</button></div>
  <label>聊天主题</label>
  <div class="grid">
    <button class="menuBtn" data-theme-pick="dark">🌙 深色主题</button>
    <button class="menuBtn" data-theme-pick="day">☀️ 白天主题</button>
    <button class="menuBtn" data-theme-pick="cute">🎀 可爱粉色</button>
  </div>
  <label>你发消息后，对方回复概率：<span id="replyLabel">75%</span></label>
  <input class="field" id="replyProb" type="range" min="0" max="100" value="75">
  <label>对方主动发消息概率：<span id="activeLabel">20%</span></label>
  <input class="field" id="activeProb" type="range" min="0" max="100" value="20">
  <label>对方随机互动频率</label>
  <select class="field" id="interval">
    <option value="15">较频繁</option>
    <option value="30" selected>正常</option>
    <option value="60">较慢</option>
    <option value="120">很慢</option>
  </select>
  <button class="btn primary" id="saveSettings">保存设置</button>
  <p class="note">回复与主动消息按概率随机触发。转账和电话是本地模拟，不会真的转账或拨打电话。</p>
</section>

<section class="panel hidden" id="profilePanel">
  <div class="panelHead">头像与名称 <button class="close" data-close>×</button></div>
  <label>你的昵称</label><input class="field" id="myName" placeholder="例如：小青柠">
  <label>你的头像图片链接（可留空）</label><input class="field" id="myAvatarUrl" placeholder="https://……">
  <label>或从手机相册选择你的头像</label><input class="field" id="myAvatarFile" class="field" type="file" accept="image/*">
  <label>你的默认头像表情</label><input class="field" id="myAvatarEmoji" placeholder="🍋">
  <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
  <label>对方的昵称</label><input class="field" id="otherName" placeholder="例如：小猪">
  <label>对方头像图片链接（可留空）</label><input class="field" id="otherAvatarUrl" placeholder="https://……">
  <label>或从手机相册选择对方头像</label><input class="field" id="otherAvatarFile" type="file" accept="image/*">
  <label>对方的默认头像表情</label><input class="field" id="otherAvatarEmoji" placeholder="🐺">
  <button class="btn primary" id="saveProfile">保存双方资料</button>
  <p class="note">上传的头像保存在当前浏览器。图片太大时可能占用较多本地存储空间。</p>
</section>

<section class="panel hidden" id="cardsPanel">
  <div class="panelHead">字卡库 <button class="close" data-close>×</button></div>
  <label>字卡分组</label>
  <div class="row">
    <select class="field" id="cardGroup"></select>
    <button class="btn" id="newGroup">＋ 新分组</button>
  </div>
  <label>字卡名称（选填）</label><input class="field" id="cardTitle" placeholder="例如：撒娇、晚安">
  <label>字卡内容</label><textarea class="field" id="cardText" placeholder="输入对方可能说的话……"></textarea>
  <button class="btn primary" id="addCard">＋ 添加字卡</button>
  <label>快速筛选分组</label><select class="field" id="filterGroup"></select>
  <div id="cardList"></div>
  <p class="note">添加时可直接选已有分组，也可一键新建；对方随机回复时会从全部字卡中抽取。</p>
</section>

<section class="panel hidden" id="transferPanel">
  <div class="panelHead">给对方转账 <button class="close" data-close>×</button></div>
  <label>金额</label><input class="field" id="amount" type="number" min="0.01" step="0.01" placeholder="输入金额">
  <label>留言</label><input class="field" id="transferNote" placeholder="给你买奶茶">
  <button class="btn primary" id="sendTransfer">发送转账</button>
</section>

<section class="panel hidden" id="letterPanel">
  <div class="panelHead">写信 <button class="close" data-close>×</button></div>
  <label>标题</label><input class="field" id="letterTitle" placeholder="写给你">
  <label>内容</label><textarea class="field" id="letterText" placeholder="想说的话……"></textarea>
  <button class="btn primary" id="sendLetter">发送信件</button>
</section>

<section class="panel hidden" id="emojiPanel">
  <div class="panelHead">表情管理 <button class="close" data-close>×</button></div>
  <div class="grid" id="emojiList"></div>
  <label>添加表情</label><input class="field" id="newEmoji" placeholder="🥺 或 ❤️">
  <button class="btn primary" id="addEmoji">＋ 添加表情</button>
</section>

<section class="panel hidden" id="callPanel">
  <div class="panelHead">电话 <button class="close" data-close>×</button></div>
  <p>电话会以顶部浮窗显示，通话时仍然可以在聊天框发送消息。</p>
  <button class="btn primary" id="startOutgoing">呼叫对方</button>
</section>
</div>

<div class="callMini hidden" id="callMini">
  <div class="callMiniTop">
    <div class="callAvatar" id="callAvatar">🐺</div>
    <div class="callDetails"><strong id="callName">小猪</strong><div class="callState" id="callState">通话中……</div></div>
    <button class="iconBtn" id="minimizeCall">⌄</button>
  </div>
  <div class="callActions" id="callActions"></div>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const KEY="qingning_chat_v3";
const base={
  theme:"dark",myName:"我",myEmoji:"🍋",myUrl:"",
  otherName:"小猪",otherEmoji:"🐺",otherUrl:"",
  replyProb:75,activeProb:20,interval:30,
  groups:["日常","撒娇","想念","晚安"],
  cards:[
    {title:"想你",text:"宝宝，我想你了",group:"想念"},
    {title:"抱抱",text:"快来抱抱我",group:"撒娇"},
    {title:"撒娇",text:"我要抱抱",group:"撒娇"},
    {title:"喜欢",text:"好喜欢你",group:"日常"},
    {title:"日常",text:"宝宝在干嘛呢？",group:"日常"},
    {title:"晚安",text:"早点睡，晚安宝宝",group:"晚安"}
  ],
  emojis:["❤️","🥺","😘","🫂","💕","🌙","🍎"],
  messages:[]
};
let d;
try{d=Object.assign({},base,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){d={...base}}
d.groups=Array.isArray(d.groups)?d.groups:base.groups.slice();
d.cards=Array.isArray(d.cards)?d.cards:base.cards.slice();
d.emojis=Array.isArray(d.emojis)?d.emojis:base.emojis.slice();
d.messages=Array.isArray(d.messages)?d.messages:[];
let timer=null,callState="idle",callTimer=null,callHidden=false;

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(d))}
  catch(e){alert("本地空间不足。可以换一张小一点的头像图片。")}
}
function avatarContent(el,url,emoji){
  el.replaceChildren();
  if(url){
    const img=document.createElement("img");img.src=url;
    img.onerror=()=>{el.textContent=emoji||"🍋"};
    el.appendChild(img);
  }else el.textContent=emoji||"🍋";
}
function hidePanels(){document.querySelectorAll(".panel").forEach(x=>x.classList.add("hidden"))}
function showPanel(id){hidePanels();$(id).classList.remove("hidden")}
function timeNow(){return new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}
function updateProfile(){
  $("headName").textContent=d.otherName;
  avatarContent($("headAvatar"),d.otherUrl,d.otherEmoji);
  avatarContent($("callAvatar"),d.otherUrl,d.otherEmoji);
  $("callName").textContent=d.otherName;
}
function addMessage(text,who="other",extra={}){
  d.messages.push({id:Date.now()+Math.random(),text,who,time:timeNow(),...extra});
  save();renderMessages();
}
function renderMessages(){
  const chat=$("chat");chat.replaceChildren();
  if(!d.messages.length){
    const hello=document.createElement("div");hello.className="dayline";hello.textContent="青柠私语 · 聊天开始啦 ☘";chat.appendChild(hello);return;
  }
  d.messages.forEach(m=>{
    const row=document.createElement("div");row.className="msg "+(m.who==="me"?"me":"");
    const av=document.createElement("div");av.className="avatar";
    avatarContent(av,m.who==="me"?d.myUrl:d.otherUrl,m.who==="me"?d.myEmoji:d.otherEmoji);
    row.appendChild(av);
    const stack=document.createElement("div");
    const bubble=document.createElement("div");bubble.className="bubble";
    if(m.type==="transfer"){
      const card=document.createElement("div");card.className="transfer";
      const top=document.createElement("div");top.className="transferTop";
      const ico=document.createElement("div");ico.className="transferIcon";ico.textContent="¥";
      const info=document.createElement("div");
      const title=document.createElement("div");title.className="transferTitle";
      title.textContent=m.who==="me"?"转账给对方":"对方转账给你";
      const amount=document.createElement("div");amount.className="money";amount.textContent="¥ "+Number(m.amount).toFixed(2);
      info.append(title,amount);top.append(ico,info);
      const note=document.createElement("div");note.className="transferNote";note.textContent=m.text||"心意已送达";
      const bottom=document.createElement("div");bottom.className="transferBottom";bottom.textContent=m.status||"待处理";
      card.append(top,note,bottom);bubble.replaceChildren(card);
    }else if(m.type==="letter"){
      bubble.textContent="✉ "+(m.title||"写给你")+"\n"+m.text;
    }else bubble.textContent=m.text;
    stack.appendChild(bubble);
    const tm=document.createElement("div");tm.className="time";tm.textContent=m.time||"";stack.appendChild(tm);
    row.appendChild(stack);chat.appendChild(row);
  });
  chat.scrollTop=chat.scrollHeight;
}
function sendMyMessage(text){
  text=String(text||"").trim();if(!text)return;
  addMessage(text,"me");
  $("input").value="";
  if(Math.random()*100<Number(d.replyProb)){
    const delay=1000+Math.random()*3500;
    setTimeout(()=>{if(Math.random()<.75)replyCard();else addMessage("嗯嗯，宝宝，我在听。","other")},delay);
  }
}
function replyCard(group){
  let pool=d.cards.filter(c=>!group||c.group===group);
  if(!pool.length)pool=d.cards;
  if(!pool.length){addMessage("宝宝，我在呢。","other");return}
  const c=pool[Math.floor(Math.random()*pool.length)];
  addMessage(c.text,"other");
}
function spontaneous(){
  if(Math.random()*100<Number(d.activeProb))replyCard();
}
function restartTimer(){clearInterval(timer);timer=setInterval(spontaneous,Math.max(10,Number(d.interval)||30)*1000)}
function renderGroups(){
  const a=$("cardGroup"),b=$("filterGroup");
  a.replaceChildren();b.replaceChildren();
  d.groups.forEach(g=>{
    const o=document.createElement("option");o.value=g;o.textContent=g;a.appendChild(o);
    const p=document.createElement("option");p.value=g;p.textContent=g;b.appendChild(p);
  });
  const all=document.createElement("option");all.value="__all";all.textContent="全部分组";b.prepend(all);b.value="__all";
}
function renderCards(){
  renderGroups();
  const list=$("cardList");list.replaceChildren();
  const filter=$("filterGroup").value||"__all";
  d.cards.forEach((c,i)=>{
    if(filter!=="__all"&&c.group!==filter)return;
    const box=document.createElement("div");box.className="cardItem";
    const title=document.createElement("div");title.className="cardTitle";title.textContent=(c.title||"未命名字卡")+" · "+(c.group||"日常");
    const txt=document.createElement("div");txt.className="cardText";txt.textContent=c.text;
    const btns=document.createElement("div");btns.className="cardBtns";
    const use=document.createElement("button");use.textContent="自己发送";
    use.onclick=()=>{addMessage(c.text,"me");hidePanels();};
    const del=document.createElement("button");del.textContent="删除";
    del.onclick=()=>{if(confirm("删除这张字卡？")){d.cards.splice(i,1);save();renderCards()}};
    btns.append(use,del);box.append(title,txt,btns);list.appendChild(box);
  });
}
function renderEmojis(){
  const list=$("emojiList");list.replaceChildren();
  d.emojis.forEach((e,i)=>{
    const b=document.createElement("button");b.className="menuBtn";b.textContent=e+"　×";
    b.onclick=()=>{d.emojis.splice(i,1);save();renderEmojis()};
    list.appendChild(b);
  });
}
function setTheme(theme){d.theme=theme;document.body.dataset.theme=theme;save()}
function readFile(file,callback){
  if(!file)return;
  if(!file.type.startsWith("image/")){alert("请选择图片文件");return}
  const reader=new FileReader();
  reader.onload=()=>callback(String(reader.result));
  reader.readAsDataURL(file);
}
function openCall(state){
  clearTimeout(callTimer);callState=state;callHidden=false;
  $("callMini").classList.remove("hidden");
  $("callActions").replaceChildren();
  if(state==="incoming"){
    $("callState").textContent="对方正在打来……";
    callButton("拒接","red",()=>endCall("已拒接"));
    callButton("接听","",()=>openCall("connected"));
    addMessage("📞 "+d.otherName+" 正在给你打电话","other");
  }else if(state==="calling"){
    $("callState").textContent="正在呼叫对方……";
    callButton("挂断","red",()=>endCall("已挂断"));
    callTimer=setTimeout(()=>{if(callState==="calling")openCall("connected")},1800);
  }else if(state==="connected"){
    $("callState").textContent="通话中 · 你可以继续发消息";
    callButton("结束通话","red",()=>endCall("通话结束"));
  }
}
function callButton(label,cls,fn){
  const b=document.createElement("button");b.textContent=label;if(cls)b.className=cls;b.onclick=fn;$("callActions").appendChild(b);
}
function endCall(status){
  clearTimeout(callTimer);callState="idle";$("callMini").classList.add("hidden");
  addMessage("📞 "+status,"me");
}
function sendTransfer(){
  const amount=Number($("amount").value);
  if(!Number.isFinite(amount)||amount<=0){alert("请输入有效金额");return}
  addMessage($("transferNote").value.trim()||"心意已送达","me",{type:"transfer",amount,status:"已发送"});
  $("amount").value="";$("transferNote").value="";hidePanels();
  // 对方是否接受由模拟对象随机决定，不由用户替对方点击
  setTimeout(()=>{
    const accepted=Math.random()<.75;
    const msg=d.messages.findLast?d.messages.findLast(m=>m.type==="transfer"&&m.who==="me"):null;
    if(accepted)addMessage("对方已收取这份心意 💛","other");
    else addMessage("对方暂时没有收取这份心意。","other");
  },2000+Math.random()*3000);
}

$("openMenu").onclick=()=>showPanel("menuPanel");
$("openCards").onclick=()=>{renderCards();showPanel("cardsPanel")};
$("openEmoji").onclick=()=>{renderEmojis();showPanel("emojiPanel")};
$("openLetter").onclick=()=>showPanel("letterPanel");
$("callMe").onclick=()=>showPanel("callPanel");
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=hidePanels);
document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{const id=b.dataset.open;if(id==="cardsPanel")renderCards();showPanel(id)});
document.querySelectorAll("[data-theme-pick]").forEach(b=>b.onclick=()=>setTheme(b.dataset.themePick));
$("send").onclick=()=>sendMyMessage($("input").value);
$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMyMessage($("input").value)}});
$("replyProb").oninput=()=>{$("replyLabel").textContent=$("replyProb").value+"%"};
$("activeProb").oninput=()=>{$("activeLabel").textContent=$("activeProb").value+"%"};
$("saveSettings").onclick=()=>{
  d.replyProb=Number($("replyProb").value);d.activeProb=Number($("activeProb").value);
  d.interval=Number($("interval").value);save();restartTimer();hidePanels();
};
$("saveProfile").onclick=()=>{
  d.myName=$("myName").value.trim()||"我";d.myEmoji=$("myAvatarEmoji").value.trim()||"🍋";
  d.myUrl=$("myAvatarUrl").value.trim()||d.myUrl;
  d.otherName=$("otherName").value.trim()||"小猪";d.otherEmoji=$("otherAvatarEmoji").value.trim()||"🐺";
  d.otherUrl=$("otherAvatarUrl").value.trim()||d.otherUrl;
  save();updateProfile();renderMessages();hidePanels();
};
$("myAvatarFile").onchange=e=>readFile(e.target.files[0],url=>{d.myUrl=url;$("myAvatarUrl").value="";save();});
$("otherAvatarFile").onchange=e=>readFile(e.target.files[0],url=>{d.otherUrl=url;$("otherAvatarUrl").value="";save();updateProfile();});
$("newGroup").onclick=()=>{
  const name=prompt("输入新分组名称，例如：撒娇、吃醋、晚安");
  if(!name||!name.trim())return;
  const g=name.trim();
  if(!d.groups.includes(g))d.groups.push(g);
  save();renderGroups();$("cardGroup").value=g;
};
$("addCard").onclick=()=>{
  const text=$("cardText").value.trim();if(!text){alert("先写字卡内容哦");return}
  const group=$("cardGroup").value||"日常";
  d.cards.push({title:$("cardTitle").value.trim()||"字卡",text,group});
  if(!d.groups.includes(group))d.groups.push(group);
  save();$("cardTitle").value="";$("cardText").value="";renderCards();
};
$("filterGroup").onchange=renderCards;
$("addEmoji").onclick=()=>{
  const e=$("newEmoji").value.trim();if(!e)return;
  d.emojis.push(e);$("newEmoji").value="";save();renderEmojis();
};
$("sendTransfer").onclick=sendTransfer;
$("sendLetter").onclick=()=>{
  const text=$("letterText").value.trim();if(!text){alert("先写一点内容吧");return}
  addMessage(text,"me",{type:"letter",title:$("letterTitle").value.trim()||"写给你"});
  $("letterTitle").value="";$("letterText").value="";hidePanels();
  if(Math.random()*100<Number(d.replyProb))setTimeout(replyCard,1500+Math.random()*2000);
};
$("startOutgoing").onclick=()=>{hidePanels();openCall("calling")};
$("minimizeCall").onclick=()=>{$("callMini").classList.add("hidden");callHidden=true};

// 将图片选择、主题和概率设置恢复到保存值
document.body.dataset.theme=d.theme||"dark";
$("replyProb").value=d.replyProb;$("activeProb").value=d.activeProb;
$("replyLabel").textContent=d.replyProb+"%";$("activeLabel").textContent=d.activeProb+"%";
$("interval").value=String(d.interval||30);
$("myName").value=d.myName||"我";$("myAvatarEmoji").value=d.myEmoji||"🍋";
$("myAvatarUrl").value=d.myUrl&&d.myUrl.startsWith("http")?d.myUrl:"";
$("otherName").value=d.otherName||"小猪";$("otherAvatarEmoji").value=d.otherEmoji||"🐺";
$("otherAvatarUrl").value=d.otherUrl&&d.otherUrl.startsWith("http")?d.otherUrl:"";
updateProfile();renderMessages();renderCards();renderEmojis();restartTimer();
if(!d.messages.length)addMessage("宝宝，我来啦。你可以给我发消息，或者看看字卡 ☘","other");
})();
</script>
</body>
</html>
